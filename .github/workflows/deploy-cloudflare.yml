name: Deploy KARBON to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare.yml'
      - 'source/KARBON-source.zip.part.*'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source backup
        uses: actions/checkout@v4

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          echo "Inspecting source chunks"
          for part in source/KARBON-source.zip.part.*; do
            printf '%s ' "$part"
            stat -c '%s bytes' "$part"
            file "$part"
            od -An -tx1 -N8 "$part"
          done

          mkdir -p /tmp/karbon-source
          cat source/KARBON-source.zip.part.* > /tmp/KARBON-source.zip
          echo "Combined archive size: $(stat -c '%s' /tmp/KARBON-source.zip) bytes"
          sha256sum /tmp/KARBON-source.zip
          echo "Testing original archive"
          if unzip -tq /tmp/KARBON-source.zip; then
            echo "Original archive is valid"
          else
            echo "Standard ZIP check failed; attempting ZIP central-directory recovery"
            rm -f /tmp/KARBON-source-recovered.zip
            zip -FF /tmp/KARBON-source.zip --out /tmp/KARBON-source-recovered.zip || true
            if unzip -tq /tmp/KARBON-source-recovered.zip; then
              echo "Recovered archive is valid"
              mv /tmp/KARBON-source-recovered.zip /tmp/KARBON-source.zip
            else
              echo "Recovery failed. Archive tail:"
              tail -c 96 /tmp/KARBON-source.zip | od -An -tx1
              exit 1
            fi
          fi

          unzip -q /tmp/KARBON-source.zip -d /tmp/karbon-source
          test -f /tmp/karbon-source/app/package.json
          test -f /tmp/karbon-source/app/wrangler.jsonc
          echo "Required KARBON source files verified"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: /tmp/karbon-source/app
        run: bun install --frozen-lockfile

      - name: Configure KARBON Worker
        working-directory: /tmp/karbon-source/app
        run: |
          sed -i 's/app-slug-placeholder/karbon-store/g' wrangler.jsonc
          sed -i 's/"HF_ENV": "dev"/"HF_ENV": "production"/' wrangler.jsonc

      - name: Build KARBON
        working-directory: /tmp/karbon-source/app
        run: bun run build

      - name: Deploy to Cloudflare Workers (Free plan)
        working-directory: /tmp/karbon-source/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx --yes wrangler@4.157.0 deploy --config wrangler.jsonc
