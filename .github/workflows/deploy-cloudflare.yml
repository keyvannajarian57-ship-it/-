name: Deploy KARBON to Cloudflare Workers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-cloudflare.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download verified KARBON source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/karbon-source
          curl -fL --retry 3 --retry-delay 2 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3L7Gyrf2roms6qLBW7PLnksZgsY/20be3f21-1f7b-43f6-b7a8-8580fb430efa.zip' \
            -o /tmp/KARBON-source.zip
          echo "Downloaded archive: $(stat -c '%s' /tmp/KARBON-source.zip) bytes"
          echo "527cfaeaaac59db34e11365e66e2fa6909365ee06552664db63b6e4049e9940b  /tmp/KARBON-source.zip" | sha256sum -c -
          unzip -tq /tmp/KARBON-source.zip
          unzip -q /tmp/KARBON-source.zip -d /tmp/karbon-source
          test -f /tmp/karbon-source/app/package.json
          test -f /tmp/karbon-source/app/wrangler.jsonc
          echo "Verified KARBON source files"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        working-directory: /tmp/karbon-source/app
        run: bun install --frozen-lockfile

      - name: Configure KARBON Worker
        working-directory: /tmp/karbon-source/app
        run: |
          sed -i 's/app-slug-placeholder/karbon-store/g' wrangler.jsonc
          sed -i 's/"HF_ENV": "dev"/"HF_ENV": "production"/' wrangler.jsonc

      - name: Build KARBON
        working-directory: /tmp/karbon-source/app
        run: bun run build

      - name: Deploy to Cloudflare Workers (Free plan)
        working-directory: /tmp/karbon-source/app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          bunx --yes wrangler@4.157.0 deploy --config wrangler.jsonc
